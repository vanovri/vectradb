name: VectraDB CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-miri:
    name: Format, Clippy (-D warnings) & Miri UB Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Miri UB & Leak Audit on vectra-types
        run: |
          rustup toolchain install nightly --component miri,rust-src
          cargo +nightly miri test -p vectra-types

  workspace-and-oracle:
    name: Release Tests, 5.7k SLT, SQLsmith & TPC-H 22/22 Oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --release
      - run: cargo test -p vectra-oracle --release --test slt_suite -- --nocapture
      - run: cargo run --release -p vectra-oracle --bin vectra-sqlsmith -- --seeds 5000
      - run: cargo test -p vectra-exec --release --test spill_torture -- --nocapture
      - run: cargo test -p vectra-tpch --release --test m08_tpch_validation -- --nocapture
      - run: cargo test -p vectra-server --release --test m09_pgwire_concurrency -- --nocapture

  wasm-and-studio:
    name: WebAssembly Build & Studio Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release -p vectra-wasm --target wasm32-unknown-unknown
      - run: |
          cd studio
          npm ci
          npm run build
          npm test
