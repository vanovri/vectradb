[workspace]
resolver = "2"
members = [
    "crates/vectra-types",
    "crates/vectra-expr",
    "crates/vectra-storage",
    "crates/vectra-sql",
    "crates/vectra-optimizer",
    "crates/vectra-exec",
    "crates/vectra-oracle",
    "crates/vectra-tpch",
    "crates/vectra-server",
    "crates/vectra-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["VectraDB Contributors"]

[workspace.dependencies]
thiserror = "2.0"
parking_lot = "0.12"
crossbeam-deque = "0.8"
crc32c = "0.6"
ryu = "1.0"
itoa = "1.0"
memchr = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
rustyline = "15.0"
wasm-bindgen = "=0.2.100"
rusqlite = { version = "0.34", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1
opt-level = 3
